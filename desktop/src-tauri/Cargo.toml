[package]
name = "torituke-koutei"
version = "0.1.0"
description = "取り付け工程表（デスクトップ版）"
license = "MIT"
repository = "https://github.com/iori0311/koutei"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt-multi-thread"] }
tempfile = "3"
sha2 = "0.10"
